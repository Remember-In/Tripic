name: Northflank Check

# Northflank API 토큰/경로 진단용. 태그를 밀지 않고 손으로 돌린다.
# 릴리스 파이프라인(server-publish.yml)이 401 로 막힐 때 어느 경로·어느 권한이 문제인지 좁힌다.
#
# 응답 본문은 error.message 만 출력한다 — 성공 응답에는 프로젝트/팀 이름이 들어 있어 로그에 남기지 않는다.

on:
  workflow_dispatch:
    inputs:
      teamId:
        description: "팀 ID 또는 슬러그 (비우면 계정 스코프만 확인)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: Probe Northflank API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Probe
        env:
          NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          NF_TEMPLATE: ${{ vars.NORTHFLANK_TEMPLATE_ID }}
          NF_TEAM: ${{ inputs.teamId }}
        run: |
          set -uo pipefail
          API=https://api.northflank.com

          if [ -z "${NF_TOKEN}" ]; then
            echo "::error::NORTHFLANK_API_TOKEN is empty on the 'production' environment."
            exit 1
          fi

          # 토큰 값 자체는 찍지 않고 형태만 본다. 뒤에 개행/공백이 붙어 있으면 헤더가 깨져 401 이 난다.
          LEN=${#NF_TOKEN}
          TRIMMED="$(printf '%s' "${NF_TOKEN}" | tr -d '[:space:]')"
          echo "token: len=${LEN} len_without_whitespace=${#TRIMMED} dots=$(printf '%s' "${NF_TOKEN}" | tr -cd '.' | wc -c | tr -d ' ')"
          if [ "${LEN}" -ne "${#TRIMMED}" ]; then
            echo "::warning::Token contains whitespace — a trailing newline in the secret breaks the Authorization header."
          fi
          echo "template id: ${NF_TEMPLATE:-<unset>}"
          echo

          probe() {
            local label="$1" url="$2"
            local body code msg
            body="$(curl -sS -o /tmp/nf-body.json -w '%{http_code}' \
              -H "Authorization: Bearer ${TRIMMED}" "${url}" 2>/dev/null)" || body="curl-error"
            code="${body}"
            msg="$(jq -r '.error.message // empty' /tmp/nf-body.json 2>/dev/null)"
            printf '%-34s %-4s %s\n' "${label}" "${code}" "${msg}"
          }

          echo "=== account-scoped ==="
          probe "GET /v1/projects"          "${API}/v1/projects"
          probe "GET /v1/templates"         "${API}/v1/templates"
          [ -n "${NF_TEMPLATE}" ] && probe "GET /v1/templates/{id}" "${API}/v1/templates/${NF_TEMPLATE}"

          if [ -n "${NF_TEAM}" ]; then
            echo
            echo "=== team-scoped (${NF_TEAM}) ==="
            probe "GET /teams/{t}/projects"  "${API}/v1/teams/${NF_TEAM}/projects"
            probe "GET /teams/{t}/templates" "${API}/v1/teams/${NF_TEAM}/templates"
            [ -n "${NF_TEMPLATE}" ] && probe "GET /teams/{t}/templates/{id}" \
              "${API}/v1/teams/${NF_TEAM}/templates/${NF_TEMPLATE}"
          else
            echo
            echo "(teamId 입력이 비어 있어 팀 스코프는 건너뜀)"
          fi

          echo
          echo "200 이 나오는 경로가 릴리스 워크플로가 써야 할 경로다."
