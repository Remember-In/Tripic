name: Server CI

on:
  push:
    branches: ["main"]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".npmrc"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".npmrc"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".github/workflows/server-ci.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Dockerfile 과 Dockerfile.migrate 는 스테이지를 공유하지 않으므로 base image 핀이 갈라질 수 있다.
      # 갈라지면 마이그레이션 이미지만 낡은 base 에 남아 CVE 를 끌고 다니므로 CI 에서 막는다.
      - name: Verify base image pin
        run: |
          set -euo pipefail
          API_BASE="$(grep -m1 -oE '^FROM node:[^ ]+' apps/api/Dockerfile)"
          MIGRATE_BASE="$(grep -m1 -oE '^FROM node:[^ ]+' apps/api/Dockerfile.migrate)"
          if [ "$API_BASE" != "$MIGRATE_BASE" ]; then
            echo "::error::Base image mismatch — apps/api/Dockerfile uses '${API_BASE}' but apps/api/Dockerfile.migrate uses '${MIGRATE_BASE}'. Keep them identical."
            exit 1
          fi
          echo "Base image pin matches: ${API_BASE}"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/api/package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace deps & generate Prisma client
        # generate 는 DB 미접속이지만 prisma.config.ts 가 DATABASE_URL 존재를 요구 — 빌드용 더미 사용
        env:
          DATABASE_URL: "postgresql://build:build@127.0.0.1:1/build"
        run: |
          pnpm --filter @tripic/shared build
          pnpm --filter @tripic/api db:generate

      - name: Run ESLint
        run: pnpm --filter @tripic/api lint

      - name: Typecheck
        run: pnpm --filter @tripic/api typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/api/package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace deps & generate Prisma client
        # generate 는 DB 미접속이지만 prisma.config.ts 가 DATABASE_URL 존재를 요구 — 빌드용 더미 사용
        env:
          DATABASE_URL: "postgresql://build:build@127.0.0.1:1/build"
        run: |
          pnpm --filter @tripic/shared build
          pnpm --filter @tripic/api db:generate

      - name: Run unit tests
        run: pnpm --filter @tripic/api test

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/api/package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace deps & generate Prisma client
        # generate 는 DB 미접속이지만 prisma.config.ts 가 DATABASE_URL 존재를 요구 — 빌드용 더미 사용
        env:
          DATABASE_URL: "postgresql://build:build@127.0.0.1:1/build"
        run: |
          pnpm --filter @tripic/shared build
          pnpm --filter @tripic/api db:generate

      # e2e 는 Testcontainers 로 일회성 Postgres 를 띄운다 (ubuntu-latest 에 Docker 내장)
      - name: Run e2e tests
        run: pnpm --filter @tripic/api test:e2e

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/api/package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 알려진 advisory는 package.json > pnpm.overrides 의 range-scoped 패치 강제로 해결한다
      # (brace-expansion 1.1.18/5.0.9, fast-uri, js-yaml, nanoid).
      # 패치 불가능한 advisory가 다시 생기면 pnpm.auditConfig.ignoreGhsas 에 근거 주석과 함께 추가할 것.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Trivy FS Scan (code & deps)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

      - name: Trivy Config (IaC)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          format: table
          exit-code: "1"
          hide-progress: true
          severity: "HIGH,CRITICAL"
          skip-dirs: "node_modules"

  # Docker build 검증 + 이미지 취약점 스캔 (push 없음)
  docker:
    runs-on: ubuntu-latest
    needs: [lint, test, test-e2e, security]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build Docker image (api)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: false
          load: true
          tags: tripic-api:test
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          build-args: |
            APP_VERSION=test
            COMMIT_SHA=${{ github.sha }}

      # 릴리스 때 처음 깨지는 일이 없도록 마이그레이션 이미지도 PR 에서 빌드 검증한다.
      # (일회성 Job 이미지라 레지스트리에 올리지 않는다)
      - name: Build Docker image (migrator)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: apps/api/Dockerfile.migrate
          push: false
          load: false
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator
          build-args: |
            APP_VERSION=test
            COMMIT_SHA=${{ github.sha }}

      - name: Trivy Image Scan (api)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tripic-api:test
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"
