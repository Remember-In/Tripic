name: Server Publish

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  # ghcr.io/<owner>/tripic-api (metadata-action 이 소문자로 정규화)
  IMAGE_NAME: ${{ github.repository }}-api

permissions:
  contents: read

jobs:
  publish:
    name: Build and push api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC for SLSA provenance
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # 태그 버전과 apps/api/package.json 버전이 다르면 배포를 중단한다.
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./apps/api/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match apps/api/package.json version ${PKG_VERSION}. Bump the package version (or fix the tag) and re-tag."
            exit 1
          fi
          echo "Version check passed: ${PKG_VERSION}"

      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push api Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No GHA cache on release builds: a poisoned CI cache entry would
          # flow into published images (cache-poisoning supply chain vector).
          provenance: mode=max
          sbom: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
